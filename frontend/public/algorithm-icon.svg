<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  
  <!-- Binary tree representation -->
  <!-- Root node -->
  <circle cx="50" cy="25" r="8" fill="white" opacity="0.9"/>
  
  <!-- Level 2 nodes -->
  <circle cx="30" cy="45" r="7" fill="white" opacity="0.85"/>
  <circle cx="70" cy="45" r="7" fill="white" opacity="0.85"/>
  
  <!-- Level 3 nodes -->
  <circle cx="20" cy="65" r="6" fill="white" opacity="0.8"/>
  <circle cx="40" cy="65" r="6" fill="white" opacity="0.8"/>
  <circle cx="60" cy="65" r="6" fill="white" opacity="0.8"/>
  <circle cx="80" cy="65" r="6" fill="white" opacity="0.8"/>
  
  <!-- Connections -->
  <line x1="50" y1="30" x2="30" y2="40" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="50" y1="30" x2="70" y2="40" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="50" x2="20" y2="60" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="50" x2="40" y2="60" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="50" x2="60" y2="60" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="50" x2="80" y2="60" stroke="white" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Decorative arrows (algorithm flow) -->
  <path d="M 15 85 L 35 85" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 32 82 L 35 85 L 32 88" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 65 85 L 85 85" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 82 82 L 85 85 L 82 88" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
